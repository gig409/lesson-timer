<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Timer</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111827; --muted: #6b7280; --track: #e5e7eb;
    --accent: #2563eb; --warn: #d97706; --done: #dc2626; --btn: #f3f4f6; --btn-fg: #111827;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #f8fafc; --muted: #94a3b8; --track: #1e293b;
    --accent: #60a5fa; --warn: #fbbf24; --done: #f87171; --btn: #1e293b; --btn-fg: #f8fafc;
  }
  :root[data-theme="clear"] { --bg: transparent; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    container-type: size;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  .wrap { width: 100%; padding: 3cqmin; display: flex; flex-direction: column; align-items: center; gap: 2.6cqmin; }
  .label { font-size: clamp(14px, 7cqmin, 64px); font-weight: 700; color: var(--muted); text-align: center; }
  .time {
    font-size: clamp(32px, min(30cqh, 26cqw), 400px);
    font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    color: var(--fg); transition: color .3s;
  }
  .warn .time { color: var(--warn); }
  .done .time { color: var(--done); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { opacity: .35; } }
  .bar { width: min(90%, 900px); height: clamp(6px, 2.2cqmin, 20px); background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--accent); transition: width .25s linear, background .3s; }
  .warn .fill { background: var(--warn); }
  .done .fill { background: var(--done); }
  .row { display: flex; gap: 2cqmin; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 700; font-size: clamp(12px, 5.5cqmin, 36px);
    padding: .4em 1.1em; border-radius: .5em; border: 2px solid transparent;
    background: var(--btn); color: var(--btn-fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #toggle { background: var(--accent); color: #fff; min-width: 5.5em; }
  :root[data-theme="dark"] #toggle { color: #0f172a; }

  /* sound switches */
  .sw {
    font-size: clamp(10px, 3.6cqmin, 22px); font-weight: 600; padding: .35em .8em;
    display: inline-flex; align-items: center; gap: .45em; color: var(--muted);
  }
  .sw svg { width: 1.2em; height: 1.2em; flex: none; }
  .sw .slash { display: none; }
  .sw[aria-pressed="true"] { color: var(--btn-fg); border-color: var(--accent); }
  .sw[aria-pressed="false"] .slash { display: inline; }
  .sw[aria-pressed="false"] .lbl { text-decoration: line-through; }

  /* main buttons: text at full size, icons when small */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 2.6cqmin; }
  .main { display: inline-flex; align-items: center; justify-content: center; gap: .4em; }
  .main .ico { display: none; width: 1.1em; height: 1.1em; flex: none; }
  #toggle:disabled { opacity: .6; cursor: default; }

  /* compact layout: one row of icon-only buttons */
  @container (max-width: 460px) or (max-height: 290px) {
    .wrap { gap: 3cqmin; padding: 2cqmin; }
    .label { font-size: clamp(10px, 7cqmin, 40px); }
    .time { font-size: clamp(24px, min(36cqh, 30cqw), 400px); }
    .controls { flex-direction: row; gap: 2.5cqmin; }
    .row { gap: 2.5cqmin; flex-wrap: nowrap; }
    .main .txt, .sw .lbl { display: none; }
    .main, .sw {
      font-size: clamp(11px, min(9cqh, 6.5cqw), 40px);
      width: 2.3em; height: 2.3em; padding: 0; min-width: 0;
      display: inline-flex; align-items: center; justify-content: center; border-radius: .55em;
    }
    #toggle { min-width: 0; width: 2.3em; }
    .main .ico { display: block; }
    #toggle .ico { display: none; }
    #toggle[data-state="start"] .play, #toggle[data-state="pause"] .pause, #toggle[data-state="done"] .check { display: block; }
    .sw svg { width: 1.15em; height: 1.15em; }
  }
  /* compact=1 in the URL forces icon mode at any size */
  html.compact .wrap { gap: 3cqmin; padding: 2cqmin; }
  html.compact .label { font-size: clamp(10px, 7cqmin, 40px); }
  html.compact .time { font-size: clamp(24px, min(36cqh, 30cqw), 400px); }
  html.compact .controls { flex-direction: row; gap: 2.5cqmin; }
  html.compact .row { gap: 2.5cqmin; flex-wrap: nowrap; }
  html.compact .main .txt, html.compact .sw .lbl { display: none; }
  html.compact .main, html.compact .sw {
      font-size: clamp(11px, min(9cqh, 6.5cqw), 40px);
      width: 2.3em; height: 2.3em; padding: 0; min-width: 0;
      display: inline-flex; align-items: center; justify-content: center; border-radius: .55em;
    }
  html.compact #toggle { min-width: 0; width: 2.3em; }
  html.compact .main .ico { display: block; }
  html.compact #toggle .ico { display: none; }
  html.compact #toggle[data-state="start"] .play, html.compact #toggle[data-state="pause"] .pause, html.compact #toggle[data-state="done"] .check { display: block; }
  html.compact .sw svg { width: 1.15em; height: 1.15em; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="label" id="label" hidden></div>
  <div class="time" id="time" role="timer" aria-live="off">0:00</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="controls">
  <div class="row">
    <button id="toggle" class="main" data-state="start" aria-label="Start" title="Start (Space)">
      <svg class="ico play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="ico pause" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>
      <svg class="ico check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      <span class="txt" id="toggleTxt">Start</span>
    </button>
    <button id="reset" class="main" aria-label="Reset" title="Reset (R)">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="txt">Reset</span>
    </button>
  </div>
  <div class="row">
    <button class="sw" id="swEnd" aria-pressed="true" aria-label="End alarm" title="Alarm when time is up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
      <span class="lbl">End alarm</span>
    </button>
    <button class="sw" id="swTick" aria-pressed="true" aria-label="Final seconds countdown" title="Countdown beep each second near the end">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
      <span class="lbl" id="tickLbl">Last 15s countdown</span>
    </button>
  </div>
  </div>
</div>
<script>
/*
  URL options (all optional):
    m=4              minutes (decimals ok, e.g. m=2.5)
    s=30             extra seconds (added to m)
    label=Do%20Now   text shown above the clock
    end=0            start with the end alarm switched off   (sound=0 also works)
    ticks=0          start with the final-seconds countdown beeps switched off
    tickfrom=15      when the countdown beeps start, in seconds before the end (default 15)
    theme=dark | clear   (clear = transparent background)
    compact=1        always use the small icon-only buttons
    auto=1           start counting as soon as the page loads
    id=q1            a unique name for this timer; use it when two slides share the same settings
  Keyboard (when opened on its own, not embedded): Space = start/pause, R = reset
*/
const q = new URLSearchParams(location.search);
const total = Math.max(1, Math.round((parseFloat(q.get('m')) || 0) * 60 + (parseFloat(q.get('s')) || 0)) || 300);
const tickFrom = Math.max(3, Math.round(parseFloat(q.get('tickfrom')) || 15));
let endOn  = q.get('end') !== '0' && q.get('sound') !== '0';
let tickOn = q.get('ticks') !== '0';
if (q.get('compact') === '1') document.documentElement.classList.add('compact');
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
if (q.get('label')) { label.textContent = q.get('label'); label.hidden = false; document.title = q.get('label') + ' timer'; }
tickLbl.textContent = `Last ${tickFrom}s countdown`;

let left = total, endAt = null, loop = null, tickTimer = null, ctx = null;
const fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
const msLeft = () => endAt ? Math.max(0, endAt - Date.now()) : left * 1000;

/* ---------- sound ---------- */
function audio() {                       // created/resumed on a click, so browsers allow it
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    loadTone();
  } catch (e) {}
  return ctx;
}
function tone(freq, start, dur, vol, type = 'sine') {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + start;
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function endAlarm() {
  window.__alarms = (window.__alarms || 0) + 1;
  if (!endOn) return;
  [0, 0.35, 0.7, 1.05].forEach(t => tone(880, t, 0.28, 0.45));
}
/* Countdown tone: one beep per second for the final seconds (0:15, 0:14 ... 0:01),
   lined up with the clock changing. The end alarm sounds at 0:00. */

let toneBuf = null;
function loadTone() {
  if (toneBuf || !ctx) return;
  toneBuf = 'loading';
  fetch(TONE_MP3).then(r => r.arrayBuffer())
    .then(a => new Promise((ok, no) => ctx.decodeAudioData(a, ok, no)))
    .then(b => { toneBuf = b; }, () => { toneBuf = null; });
}
function playTone() {
  window.__ticks = (window.__ticks || 0) + 1;
  if (!ctx) return;
  if (toneBuf && toneBuf !== 'loading') {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    g.gain.value = 1; src.buffer = toneBuf; src.connect(g); g.connect(ctx.destination); src.start();
  } else {
    tone(1000, 0, 0.12, 0.4);               // fallback until the sound file has loaded
  }
}
function tickLoop() {
  tickTimer = null;
  if (!loop) return;
  const ms = msLeft();
  if (ms <= 0) return;
  const win = tickFrom * 1000;
  if (ms > win + 40) { tickTimer = setTimeout(tickLoop, ms - win); return; }
  const k = Math.round(ms / 1000);
  let target;
  if (k >= 1 && Math.abs(ms - k * 1000) < 60) {
    left = k; render();                       // keep the clock in step with the beep
    if (tickOn) playTone();
    target = (k - 1) * 1000;
  } else {
    target = Math.floor(ms / 1000) * 1000;
  }
  if (target < 1000) return;                 // 0:00 is the end alarm's job
  tickTimer = setTimeout(tickLoop, ms - target);
}

/* ---------- timer ---------- */
function render() {
  time.textContent = fmt(left);
  fill.style.width = (msLeft() / (total * 1000) * 100) + '%';
  wrap.classList.toggle('warn', left > 0 && left <= Math.min(Math.max(tickFrom, 60), total * 0.25 || 60));
  wrap.classList.toggle('done', left === 0);
  const word = loop ? 'Pause' : (left === 0 ? 'Done' : (left < total ? 'Resume' : 'Start'));
  toggleTxt.textContent = word;
  toggle.setAttribute('aria-label', word);
  toggle.dataset.state = loop ? 'pause' : (left === 0 ? 'done' : 'start');
  toggle.disabled = left === 0;
  swEnd.setAttribute('aria-pressed', endOn);
  swTick.setAttribute('aria-pressed', tickOn);
}
function start(resumeEndAt) {
  if (loop || left === 0) return;
  audio();
  endAt = resumeEndAt || Date.now() + left * 1000;   // follows the real clock, so it stays accurate if the tab is throttled
  loop = setInterval(() => {
    left = Math.ceil(msLeft() / 1000);
    if (left === 0) { stop(); endAlarm(); }
    render();
  }, 100);
  tickLoop();
  render(); save();
}
function stop() {
  if (loop) left = Math.ceil(msLeft() / 1000);
  clearInterval(loop); loop = null; clearTimeout(tickTimer); tickTimer = null; endAt = null; render(); save();
}
function reset() { stop(); left = total; render(); save(); }

/* ---------- survive reloads ----------
   slides.com / reveal.js unloads an iframe when you leave its slide and reloads it when you
   come back. Keep the timer's state in this tab's session storage so it carries on. */
const KEY = 'lesson-timer:' + (q.get('id') || location.search);
function save() {
  try {
    const fresh = !loop && left === total;
    sessionStorage.setItem(KEY, JSON.stringify({ left, endAt: loop ? endAt : null, endOn, tickOn, fresh, at: Date.now() }));
  } catch (e) {}
}
function restore() {
  let st;
  try { st = JSON.parse(sessionStorage.getItem(KEY)); } catch (e) {}
  if (!st) return false;
  endOn = st.endOn; tickOn = st.tickOn;
  if (st.endAt) {                                    // it was running
    const ms = st.endAt - Date.now();
    if (ms > 0) { left = Math.ceil(ms / 1000); start(st.endAt); return true; }
    if (-ms < 60e3) { left = 0; render(); return true; }   // finished moments ago: show 0:00
    left = total; render(); save(); return true;      // finished earlier: start fresh (so a later slide
                                                       // with the same settings isn't stuck on 0:00)
  }
  if (!st.fresh && Date.now() - st.at < 3 * 3600e3) left = Math.min(total, Math.max(0, st.left));
  render(); return true;
}

toggle.onclick = () => loop ? stop() : start();
document.getElementById('reset').onclick = reset;
swEnd.onclick  = () => { endOn = !endOn; audio(); render(); save(); };
swTick.onclick = () => { tickOn = !tickOn; audio(); render(); save(); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); loop ? stop() : start(); }
  if (e.key === 'r' || e.key === 'R') reset();
});
document.addEventListener('pointerdown', audio);   // unlock sound on any click after a reload
/* After a button press, hand keyboard focus back to the slides so the clicker / arrow keys
   keep moving slides (and Space doesn't pause the timer by accident). */
const embedded = window.parent !== window;
document.addEventListener('click', e => {
  if (!embedded || !e.target.closest('button')) return;
  setTimeout(() => { try { document.activeElement.blur(); window.parent.focus(); } catch (err) {} }, 0);
});
render();
if (!restore() && q.get('auto') === '1') start();
